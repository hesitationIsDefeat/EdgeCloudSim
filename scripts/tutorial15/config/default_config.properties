#default config file
simulation_time=30
warm_up_period=3
file_log_enabled=true
deep_file_log_enabled=false

#logging is disabled if it is 0
vm_load_check_interval=0.1

#logging is disabled if it is 0
location_check_interval=0.1

#logging is disabled if it is 0
ap_delay_check_interval=0

min_number_of_mobile_devices=100
max_number_of_mobile_devices=800
mobile_device_counter_size=100

wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=300
wan_bandwidth=15
gsm_bandwidth=0

#all the host on cloud runs on a single datacenter
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

#mobile devices has no processing unit in this scenario
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

#use ',' for multiple values 
#orchestrator_policies=RANDOM_FIT,WORST_FIT,BEST_FIT,FIRST_FIT,NEXT_FIT
orchestrator_policies=WORST_FIT

#use ',' for multiple values
simulation_scenarios=DEFAULT_SCENARIO

#mean waiting time in seconds
attractiveness_L1_mean_waiting_time=500
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120

# ONAT: Used for edge mobility
northern_bound=1000
southern_bound=0
eastern_bound=1000
western_bound=0

# ONAT: tutorial15 investigates task PARTITION policies (see task_partition_policies
# below) rather than UAV mobility or SAR priority - UAV mobility is therefore FIXED to
# a single KMEANS variant (bare "PRIORITY_KMEANS", only one entry below, taken via
# SS.getUAVMobilityOptions()[0] in MainApp - not swept). CentralizedUAVMobility (a
# single controller with full scene visibility) runs priority-weighted K-Means, K =
# number of UAVs, Lloyd's algorithm, over every active mobile device's position, then
# sends each UAV its own cluster's centroid. There is no SAR population in this
# tutorial, so sar_priority_factor never matters here.
uav_mobility_options=PRIORITY_KMEANS

# ONAT: How often (seconds) a UAV re-evaluates/moves. Unused by tutorial15's
# centralized policy (only relevant for BasicUAVMobility's per-UAV decentralized
# scheduling) - kept here since UAV.getSpeed() etc. still come from the same UAV object.
uav_mobility_interval=5

# ONAT: How often (seconds) the centralized controller decides new UAV targets - see
# CentralizedUAVMobility. Independent from uav_mobility_interval above so the two
# cadences can be tuned/compared separately.
centralized_controller_interval=1

# ONAT: Policy used to assign mobile devices to one of the 3 hardcoded converging
# meeting areas (see ConvergingMobilityModel). Options: ROUND_ROBIN, CLOSEST
meeting_point_assignment_policy=ROUND_ROBIN

# ONAT: Task partitioning sweep for tutorial15 (see MainApp) - this tutorial's swept
# x-axis of interest: compare DAG_WORKFLOW (see applications.xml) NOT partitioned at all
# ("NO"), run as a real layered DAG ("FULL", 1->3->2->1 dependent layers), and run as a
# FLAT N-way split with no inter-layer dependencies at all ("PARTITION_<N>", forces N
# equal independent children regardless of dag_layers - see
# SimSettings.setPartitionCountOverride()/isPartitionCountOverrideActive()).
# PARTITION_7 is the fairest flat baseline against FULL: dag_layers=1,3,2,1 sums to 7
# sub-tasks, so PARTITION_7 splits the task identically (7 equal children, same size as
# FULL's) and isolates the one variable FULL actually changes - whether those children
# are submitted all at once (PARTITION_7) or in 4 dependent waves (FULL) - rather than
# also changing sub-task size. PARTITION_4 instead matches FULL's *layer count* (4
# sequential waves), but each "wave" is 1 bigger flat child instead of a layer's several
# smaller ones, so it compares a different axis (4 big sequential chunks vs 4 dependent
# layers of 1/3/2/1 smaller ones) - kept here too since it's still an informative point,
# just not the apples-to-apples one.
task_partition_policies=NO,FULL,PARTITION_4
