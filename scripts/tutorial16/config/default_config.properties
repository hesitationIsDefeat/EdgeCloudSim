#default config file
simulation_time=30

# ONAT: users start at random map positions and walk to the center meeting zone at
# 2 m/s (see ConvergingMobilityModel) - the farthest corner needs ~5 min (707 m minus the
# 100 m capture radius) to arrive. Until then many users are outside the UAV's 100 m
# service radius, so tasks created in the first 6 minutes (including ones rejected for
# being out of range) are excluded from the statistics to keep the transient out of the
# queue measurements.
warm_up_period=6
file_log_enabled=true

# ONAT: deep logging writes one line per task to *_SUCCESS.log / *_FAIL.log (start/end
# time, network delays, failure reason) so queue waits can be derived per task; the
# population is small, so the logs stay small.
deep_file_log_enabled=true

# ONAT: the *_check_interval values are in MINUTES (SimSettings multiplies by 60).
# 0.005 min = 0.3 s: fine enough to see the queue fill and drain, since a task takes
# ~1 s to execute. The *_VM_LOAD.log values are the declared utilization of the running
# task PLUS every queued one (tutorial16's SampleEdgeServerManager.getVmLoad), i.e.
# (number of tasks in the UAV) x vm_utilization_on_edge.
#logging is disabled if it is 0
vm_load_check_interval=0.005

# ONAT: 1 min = 60 s sampling of user/UAV positions keeps those logs small. It must
# stay non-zero, since SimLogger.addVmUtilizationLog() only records the VM load while
# location logging is enabled.
#logging is disabled if it is 0
location_check_interval=1

#logging is disabled if it is 0
ap_delay_check_interval=0

# ONAT: a single population size (min == max) - this tutorial is re-run per
# vm_utilization_on_edge value rather than swept over the user count. Together with
# poisson_interarrival (applications.xml) it sets the arrival rate.
min_number_of_mobile_devices=100
max_number_of_mobile_devices=100
mobile_device_counter_size=100

wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=300
wan_bandwidth=15
gsm_bandwidth=0

#all the host on cloud runs on a single datacenter
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

#mobile devices has no processing unit in this scenario
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

#use ',' for multiple values 
#orchestrator_policies=RANDOM_FIT,WORST_FIT,BEST_FIT,FIRST_FIT,NEXT_FIT
orchestrator_policies=WORST_FIT

#use ',' for multiple values
simulation_scenarios=DEFAULT_SCENARIO

#mean waiting time in seconds
attractiveness_L1_mean_waiting_time=500
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120

# ONAT: Used for edge mobility
northern_bound=1000
southern_bound=0
eastern_bound=1000
western_bound=0

# ONAT: UAV mobility is fixed to bare "PRIORITY_KMEANS" (only one entry, taken via
# SS.getUAVMobilityOptions()[0] in MainApp - not swept), same as tutorial15. With a single
# UAV the K-Means centroid is simply the center of all users' positions, so the UAV
# stays on the crowd.
uav_mobility_options=PRIORITY_KMEANS

# ONAT: How often (seconds) a UAV re-evaluates/moves. Unused by the centralized policy
# (only relevant for BasicUAVMobility's per-UAV decentralized scheduling) - kept here
# since UAV.getSpeed() etc. still come from the same UAV object.
uav_mobility_interval=5

# ONAT: How often (seconds) the centralized controller decides new UAV targets - see
# CentralizedUAVMobility.
centralized_controller_interval=5

# ONAT: Policy used to assign mobile devices to a converging meeting area (see
# ConvergingMobilityModel). Like tutorial15, tutorial16 uses a SINGLE meeting area at the
# center of the map (see SampleScenarioFactory), so ROUND_ROBIN/CLOSEST both resolve every
# device to that same area. Options: ROUND_ROBIN, CLOSEST
meeting_point_assignment_policy=ROUND_ROBIN
