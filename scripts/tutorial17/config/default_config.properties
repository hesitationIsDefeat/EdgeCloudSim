#default config file
simulation_time=30
warm_up_period=3
file_log_enabled=true
deep_file_log_enabled=false

#logging is disabled if it is 0
vm_load_check_interval=0.1

#logging is disabled if it is 0
location_check_interval=0.1

#logging is disabled if it is 0
ap_delay_check_interval=0

min_number_of_mobile_devices=100
max_number_of_mobile_devices=800
mobile_device_counter_size=100

wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=300
wan_bandwidth=15
gsm_bandwidth=0

#all the host on cloud runs on a single datacenter
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

#mobile devices has no processing unit in this scenario
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

#use ',' for multiple values 
#orchestrator_policies=RANDOM_FIT,WORST_FIT,BEST_FIT,FIRST_FIT,NEXT_FIT
orchestrator_policies=WORST_FIT

#use ',' for multiple values
simulation_scenarios=DEFAULT_SCENARIO

#mean waiting time in seconds
attractiveness_L1_mean_waiting_time=500
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120

# ONAT: Used for edge mobility
northern_bound=1000
southern_bound=0
eastern_bound=1000
western_bound=0

# ONAT: tutorial17 sweeps CENTRALIZED UAV mobility policies - a single controller
# (CentralizedUAVMobility, see SampleScenarioFactory.getEdgeMobilityModel()) with full
# visibility of the scene decides every UAV's next move. Unlike tutorial10, NO (stay
# put) and RANDOM (independent random destinations) are intentionally EXCLUDED here -
# they aren't real demand-aware placement policies, so this tutorial focuses purely on
# the 4 policies that actually react to where users are:
# PRIORITY_KMEANS = controller runs priority-weighted K-Means (K = number of UAVs) over
# every active mobile device's position and sends each UAV its own cluster's centroid.
# APF = controller runs centralized Artificial Potential Fields: every active user
# attracts every UAV (inverse-square) while every other UAV repels it (inverse-square,
# prevents swarm overlap), and each UAV is alerted in the direction of its own net force.
# CAPACITY_FILL = controller discretizes the map into a grid, sums each cell's demand,
# then greedily fills the highest-demand cells first with just enough of the nearest
# unassigned UAVs (capacity self-scales with the swept device count).
# ADAPTIVE_KMEANS = a state machine that behaves like PRIORITY_KMEANS while users are
# still scattering, then parks UAVs at the resulting cluster centroids once they stop
# moving - with tutorial17's plain random walk (see SampleMobilityModel, users never
# actually stop moving), this effectively never leaves its initial K-Means phase.
# None of these policies are aware of which services a UAV hosts (see
# service_placement_policies below) - they only react to where users physically are, not
# which application each one is about to request - so a UAV hosting only one service can
# still end up far from the one user who needed it; this is what produces the
# REJECTED_DUE_TO_VM_CAPACITY failures this tutorial is meant to surface.
uav_mobility_options=PRIORITY_KMEANS

# ONAT: How often (seconds) a UAV re-evaluates/moves. Unused by centralized policies
# (only relevant for BasicUAVMobility's per-UAV decentralized scheduling) - kept here
# since UAV.getSpeed() etc. still come from the same UAV object.
uav_mobility_interval=5

# ONAT: How often (seconds) the centralized controller decides new UAV targets - see
# CentralizedUAVMobility. Independent from uav_mobility_interval above so the two
# cadences can be tuned/compared separately.
centralized_controller_interval=5

# ONAT: tutorial17 sweeps SERVICE PLACEMENT policies - which application services (see
# applications.xml's service_index) each UAV hosts. A task is only ever offloaded to a UAV
# that hosts its service, so these are not hard-coded per host in edge_devices.xml anymore.
# Use ',' for multiple values; every policy listed is run for every UAV mobility option.
# SINGLE = every UAV hosts exactly one service, spread evenly over the services (e.g. 16
# UAVs and 4 services -> 4 UAVs per service; UAV i hosts service i % #services, so UAVs
# that start next to each other host different services).
# ALL = every UAV hosts every service.
service_placement_policies=SINGLE,ALL
# ONAT: unused by tutorial17 (no ConvergingMobilityModel/meeting zone - see
# SampleMobilityModel) but still read by SimSettings, kept at its default for clarity.
meeting_point_assignment_policy=ROUND_ROBIN
