#default config file
simulation_time=30
warm_up_period=3
file_log_enabled=true
deep_file_log_enabled=false

#logging is disabled if it is 0
vm_load_check_interval=0.1

#logging is disabled if it is 0
location_check_interval=0.1

#logging is disabled if it is 0
ap_delay_check_interval=0

# ONAT: tutorial14 has NO normal-user population and no device-count sweep - every
# mobile device is a SAR member running LLM_INFERENCE, and this population size is
# FIXED (min == max, so MainApp reads one value instead of looping - see MainApp).
# 50 = 10 fixed teams of sar_team_size=5 below; change this single value to resize
# the (fixed, non-swept) population.
min_number_of_mobile_devices=50
max_number_of_mobile_devices=50
mobile_device_counter_size=50

wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=300
wan_bandwidth=15
gsm_bandwidth=0

#all the host on cloud runs on a single datacenter
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

#mobile devices has no processing unit in this scenario
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

#use ',' for multiple values 
#orchestrator_policies=RANDOM_FIT,WORST_FIT,BEST_FIT,FIRST_FIT,NEXT_FIT
orchestrator_policies=WORST_FIT

#use ',' for multiple values
simulation_scenarios=DEFAULT_SCENARIO

#mean waiting time in seconds
attractiveness_L1_mean_waiting_time=500
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120

# ONAT: Used for edge mobility
northern_bound=1000
southern_bound=0
eastern_bound=1000
western_bound=0

# ONAT: tutorial14 fixes UAV mobility to the PRIORITY_KMEANS_6 variant established as
# the best-performing configuration in tutorial12/13 (not swept here - see MainApp,
# which instead sweeps partition_count_options below).
uav_mobility_options=PRIORITY_KMEANS_6

# ONAT: How often (seconds) a UAV re-evaluates/moves. Unused by tutorial14's
# centralized policy (only relevant for BasicUAVMobility's per-UAV decentralized
# scheduling) - kept here since UAV.getSpeed() etc. still come from the same UAV object.
uav_mobility_interval=5

# ONAT: How often (seconds) the centralized controller decides new UAV targets.
centralized_controller_interval=1

# ONAT: Unused in this tutorial (no normal-user population to assign to meeting areas)
# - kept at its default for consistency with sibling tutorials.
meeting_point_assignment_policy=ROUND_ROBIN

# ONAT: SAR (Search & Rescue) team parameters. This tutorial's ONLY population is SAR
# members (see min/max_number_of_mobile_devices above for the fixed count) - unlike
# tutorial8-13, member count is NOT derived from sar_member_percentage/
# computeNumOfSarMembers() here, so that property is omitted (unused).
# SAR members move together in fixed teams of this size
sar_team_size=5
# Simulation time (in minutes) at which SAR teams enter the scenario - 0 since there
# is no other population to wait for; LLM-inference devices are present from the start.
sar_entry_time=0
# SAR team movement cycle: random-walk for this long (sec), then stay still for this long (sec), then repeat
sar_move_duration=60
sar_stop_duration=300
# SAR team movement speed (m/s) during the move phase
sar_move_speed=2.0
# Comma separated application names (see applications.xml) reserved for SAR members
sar_application_names=LLM_INFERENCE
# Relative weight of a SAR member's position when the centralized controller
# averages/prioritizes user positions. Overridden by the explicit factor encoded in
# "PRIORITY_KMEANS_6" above, so this value is not actually used for this tutorial's runs.
sar_priority_factor=1.0

# ONAT: Task partitioning sweep for tutorial14 (see MainApp) - compares NOT
# partitioning tasks (NO, which can never admit this app - see applications.xml) against
# FULL partitioning under the fixed PRIORITY_KMEANS_6 mobility policy above.
task_partition_policies=NO,FULL
# ONAT: tutorial14's swept x-axis (replaces device count) - LLM_INFERENCE's
# partition_count is overridden to each of these values in turn, every run, regardless
# of applications.xml's own partition_count - see SimSettings.setPartitionCountOverride().
partition_count_options=1,2,4,8,16
