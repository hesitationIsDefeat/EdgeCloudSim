#default config file
simulation_time=30
warm_up_period=3
file_log_enabled=true
deep_file_log_enabled=false

#logging is disabled if it is 0
vm_load_check_interval=0.1

#logging is disabled if it is 0
location_check_interval=0.1

#logging is disabled if it is 0
ap_delay_check_interval=0

min_number_of_mobile_devices=100
max_number_of_mobile_devices=800
mobile_device_counter_size=100

wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=300
wan_bandwidth=15
gsm_bandwidth=0

# ONAT: inter-UAV link bandwidth (Mbps) - used for the relay delay between consecutive DAG
# layers: both the sub-task layers of an application that is itself a DAG (dag_layers in
# applications.xml) and the layers of a stream (streams.xml). A finished layer's output that
# has to move to a different UAV than the one that produced it costs size/bandwidth, the layer
# waits for the slowest destination, and nothing is paid if the next layer runs on the UAV(s)
# the output already sits on. 0 disables the delay.
uav_bandwidth=100

#all the host on cloud runs on a single datacenter
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=100000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

#mobile devices has no processing unit in this scenario
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

#use ',' for multiple values 
#orchestrator_policies=RANDOM_FIT,WORST_FIT,BEST_FIT,FIRST_FIT,NEXT_FIT
orchestrator_policies=WORST_FIT

#use ',' for multiple values
simulation_scenarios=DEFAULT_SCENARIO

#mean waiting time in seconds
attractiveness_L1_mean_waiting_time=500
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120

# ONAT: Used for edge mobility
northern_bound=1000
southern_bound=0
eastern_bound=1000
western_bound=0

# ONAT: tutorial19 compares CENTRALIZED UAV mobility policies (CentralizedUAVMobility, one
# controller with full visibility of the scene decides every UAV's next move) under the world
# events of events.xml. Use ',' for multiple values; every policy listed is run for every
# service placement policy and the plots have one line per policy.
# PRIORITY_KMEANS = the service-BLIND baseline: priority-weighted K-Means (K = number of UAVs)
# over every active user's position, each UAV goes to its own cluster's centroid. It follows
# the crowds - not which services the crowds are asking for.
# SERVICE_KMEANS = the same K-Means, but over the REQUESTS of the last service_demand_window
# seconds (see below), and a request can only join the cluster of a UAV that hosts the service
# it needs - so the UAVs of each service cluster independently over that service's demand.
# SERVICE_APF = artificial potential fields: a request only attracts the UAVs that host its
# service, and two UAVs repel each other in proportion to how much of what they host overlaps
# (UAVs with different services may stack - a stream needs several at once).
# SERVICE_CAPACITY_FILL = the grid-based demand fill, per service: the (cell, service) pairs
# with the highest demand are served first by the nearest free UAV hosting that service.
# A service-aware policy leaves a UAV where it is when no request for its services is around.
# Also available: APF, CAPACITY_FILL, ADAPTIVE_KMEANS (service-blind), NO, RANDOM.
uav_mobility_options=PRIORITY_KMEANS,SERVICE_KMEANS,SERVICE_APF,SERVICE_CAPACITY_FILL

# ONAT: How often (seconds) a UAV re-evaluates/moves. Unused by centralized policies
# (only relevant for BasicUAVMobility's per-UAV decentralized scheduling) - kept here
# since UAV.getSpeed() etc. still come from the same UAV object.
uav_mobility_interval=5

# ONAT: How often (seconds) the centralized controller decides new UAV targets - see
# CentralizedUAVMobility. Independent from uav_mobility_interval above so the two
# cadences can be tuned/compared separately.
centralized_controller_interval=5

# ONAT: Which application services (see applications.xml's service_index) each UAV hosts.
# Service awareness only matters when a UAV hosts a SUBSET of the services - this tutorial
# therefore uses SINGLE: every UAV hosts exactly one service, spread evenly over the services
# (16 UAVs and 4 services -> 4 UAVs per service; UAV i hosts service i % #services, so the 4 UAVs
# of each starting quadrant host 4 different services). With ALL every UAV could serve every
# request and the service-aware policies would reduce to their service-blind counterparts.
# The plots hold ONE placement policy fixed (the first entry).
service_placement_policies=SINGLE

# ONAT: World events (listed one by one in events.xml, the 7th MainApp argument - nothing about them is random).
# true = users make requests ONLY while inside the radius of an active event, and then only that
# event's request (the usage_percentage / active / idle values of applications.xml and
# streams.xml are not used). false = the users keep their normal requests (those values must
# then add up to 100) and the events' requests come on top.
event_requests_only=true
# true = users within an event's attraction radius when it starts may walk to it (with the
# event's participation probability), stay inside its radius while it lasts and walk home when
# it ends - so crowds form at events and dissolve. false = users only random-walk and the events
# only get the requests of whoever happens to be inside their radius.
event_gather=true
# Speed (m/s) of a user walking to / from an event.
event_gather_speed=5

# ONAT: What the service-aware policies see: the requests made in the last service_demand_window
# seconds (a real controller could have observed them - rejected requests count too), plus the
# requests of the next service_demand_lookahead seconds (0 = none; > 0 reads the pre-generated
# request list ahead of time, an oracle for comparison). See ServiceDemandTracker.
service_demand_window=60
service_demand_lookahead=0

# ONAT: unused by tutorial19 (no ConvergingMobilityModel/meeting zone) but still read by
# SimSettings, kept at its default for clarity.
meeting_point_assignment_policy=ROUND_ROBIN
