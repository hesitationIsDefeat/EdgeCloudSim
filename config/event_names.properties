# ONAT: Used to store the names of a tutorial's events files for both explanation and execution purposes
# ONAT: Key = <tutorial>.<events file name without .xml>, value = the name that events file is run under.
# ONAT: Every scripts/<tutorial>/config/events*.xml is one events file, and the whole tutorial is run once
# ONAT: for each of them. The results of a run go to a folder with its name (sim_results/<tutorial>/<name>/ite<N>,
# ONAT: and the plots to <tutorial name>/<name>), so a name may only contain letters, digits, '_', '-' and '.'
# ONAT: and must be unique within a tutorial. A file without an entry is run under its own file name.
tutorial19.events=MixedEvents
tutorial19.events_multisite=MultiSite
tutorial19.events_silentcrowd=SilentCrowd
