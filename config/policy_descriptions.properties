# ONAT: Used to store a short explanation of every policy/strategy the simulation can run.
# ONAT: Keys are <category>.<POLICY_NAME>; the category names the default_config.properties key
# ONAT: (or applications.xml / edge_devices.xml tag) the policy name is written under.
# ONAT: "<N>", "<MB>", "<factor>" and "<weights>" in a key stand for a value chosen in the config.
# ONAT: Tutorials 6-19 are the UAV simulation (UAVEdgeOrchestrator, UAVNetworkModel and a
# ONAT: Basic/CentralizedUAVMobility); tutorials 1-4 and sample_app1-5 are the original
# ONAT: EdgeCloudSim ones, listed at the end.

# ============================================================================================
# UAV MOBILITY (uav_mobility_options) - where each UAV goes next
# ============================================================================================
# ONAT: Decentralized: BasicUAVMobility (tutorials 6-9, 11). Every UAV decides its own move
# ONAT: every uav_mobility_interval seconds.
uav_mobility.NO=UAVs never move (also supported by the centralized controller).
uav_mobility.RANDOM=Every UAV random-walks: a 1..max-move-distance step along one random axis per tick (also supported by the centralized controller).
uav_mobility.LOCAL=Each UAV moves towards the centroid of the active users inside its own service radius (100 m); random walk when it sees none.
uav_mobility.LOCAL_FORCE=LOCAL plus an inverse-square repulsion from other UAVs within 2x the service radius, so UAVs drawn to one crowd settle apart instead of stacking.
uav_mobility.ASSIGNED_LOCAL=Users are split round-robin into fixed groups, one per UAV; each UAV chases the centroid of its own group even when they are out of its range.
uav_mobility.VORONOI=Decentralized centroidal-Voronoi coverage: every user in range of a UAV belongs to the nearest one; each UAV moves to the priority-weighted centroid of its cell (SAR weight = sar_priority_factor), random walk if its cell is empty.
uav_mobility.VORONOI_<factor>=VORONOI with the SAR priority factor fixed by the name (e.g. VORONOI_2 weighs a SAR member 2.0 against 1.0 for a normal user) instead of sar_priority_factor.
uav_mobility.GLOBAL=Reserved in BasicUAVMobility and currently a no-op: the UAV stays where it is.

# ONAT: Centralized: CentralizedUAVMobility (tutorials 10-19). One controller sees every UAV and
# ONAT: user and alerts each UAV with a target every centralized controller interval.
uav_mobility.PRIORITY_KMEANS=Priority-weighted K-Means (Lloyd's algorithm, K = number of UAVs, clusters seeded at the UAVs' positions, at most 20 iterations); every UAV is sent to the centroid of its cluster.
uav_mobility.PRIORITY_KMEANS_<factor>=PRIORITY_KMEANS with the SAR priority factor fixed by the name (e.g. PRIORITY_KMEANS_4), same convention as VORONOI_<factor>.
uav_mobility.APF=Centralized artificial potential fields: every active user attracts every UAV (inverse-square, scaled by its priority) and every other UAV repels it; a UAV whose forces cancel out gets a random nudge.
uav_mobility.CAPACITY_FILL=Demand-fill: the map is cut into grid cells with the summed priority of their users as demand; cells are filled most-demanding first, each taking just enough of the nearest free UAVs to cover it (per-UAV capacity = total demand / number of UAVs), so one crowd cannot trap every UAV. Unassigned UAVs stay.
uav_mobility.ADAPTIVE_KMEANS=Three-phase K-Means without priority weights: scattered (plain K-Means over the users), gathered (meeting-area centroids frozen, UAVs hold), SAR arrived (one UAV parked at each frozen centroid, the remaining UAVs re-clustered onto the devices that became active after the gathering).
uav_mobility.SERVICE_KMEANS=Service-aware K-Means: the demand is the requests of the last service_demand_window seconds and a request can only join the nearest UAV that hosts its service, so UAVs of one service cluster over that service's demand alone.
uav_mobility.SERVICE_APF=Service-aware APF: a request attracts only UAVs hosting its service, and the repulsion between two UAVs is scaled by the overlap (Jaccard) of the services they host, so UAVs with different services may stack where several are needed. A UAV nothing pulls holds still.
uav_mobility.SERVICE_CAPACITY_FILL=Service-aware demand-fill: grid cells have a demand per service; (cell, service) pairs are filled highest first by the nearest free UAV hosting that service, which then also covers other hosted services in the cell with its capacity. Leftover UAVs stay; overlapping UAVs in one cell disperse slightly.

# ============================================================================================
# OFFLOADING (orchestrator_policies) - which device and which VM runs a task
# ============================================================================================
offloading.UAV_ORCHESTRATOR=What tutorials 6-19 actually run (UAVEdgeOrchestrator), not configurable by name: every task goes to the UAV edge (never cloud or mobile); eligible UAVs are within the 100 m service radius, host the task's service and still have free RAM (VM RAM - service_ram of its hosted services - queue_ram of the running and waiting tasks - RAM reserved for siblings of the same batch >= the task's queue_ram); the least loaded eligible UAV (declared CPU share of running + waiting + reserved tasks) wins, and with none eligible the task is rejected.
offloading.WORST_FIT=In tutorials 6-19 only a label of the run (UAVEdgeOrchestrator ignores the name; its least-loaded choice is effectively worst-fit). In BasicEdgeOrchestrator/tutorial1: the VM with the most free CPU capacity that fits the task.
offloading.BEST_FIT=BasicEdgeOrchestrator/tutorial1: the VM with the least free CPU capacity that still fits the task (tight packing).
offloading.FIRST_FIT=BasicEdgeOrchestrator/tutorial1: the first VM that can take the task.
offloading.NEXT_FIT=BasicEdgeOrchestrator/tutorial1: round-robin, scanning from the VM selected last.
offloading.RANDOM_FIT=BasicEdgeOrchestrator/tutorial1: a random starting VM, then every VM is scanned once for one that fits.

# ============================================================================================
# TASK PARTITION (task_partition_policies) - how a task is split into sub-tasks
# ============================================================================================
task_partition.NO=Partitioning is off: every task is offloaded whole (tutorials 7, 13).
task_partition.FULL=Partitioning is on for the applications flagged partitionable in applications.xml: a flat equal split into partition_count children, or the layered DAG of dag_layers split by the application's own partition_strategy (EQUAL unless set). The default when the property is empty.
task_partition.FULL_LAYERED=FULL with the DAG split strategy forced to LAYER_EQUAL (tutorial 15).
task_partition.FULL_WEIGHTED=FULL with the DAG split strategy forced to WEIGHTED, using the application's dag_partition_weights (tutorial 15).
task_partition.FULL_(<weights>)=FULL with the WEIGHTED strategy and the weights written in the name, e.g. FULL_(0.1,(0.4,0.4),0.1); they must match dag_layers and sum to 1.0 (tutorial 15).
task_partition.PARTITION_<N>=A flat, equal N-way split with no inter-layer dependencies; for a DAG application its dag_layers are ignored (tutorials 14, 15).

# ONAT: partition_strategy of an application in applications.xml (or forced by a policy above)
task_partition_strategy.EQUAL=Default: every sub-task of the whole DAG gets an identical share of the task's length, upload and download.
task_partition_strategy.LAYER_EQUAL=The task is split equally over the DAG's layers, then each layer's share equally over its own sub-tasks.
task_partition_strategy.WEIGHTED=Explicit per-node fractions of the whole task (dag_partition_weights, or the weights of a FULL_(<weights>) policy).

# ============================================================================================
# SERVICE PLACEMENT (service_placement_policies) - which services each UAV hosts
# ============================================================================================
# ONAT: A hosted service costs its service_ram out of the UAV's VM RAM, so a placement that does
# ONAT: not fit that RAM stops the run. Without a policy, edge_devices.xml's optional
# ONAT: service_capability tag per host lists the hosted services; none means every service.
service_placement.SINGLE=Every UAV hosts exactly one service, dealt out round-robin (UAV i hosts service i % number of services) so each service is spread evenly over the map (tutorials 17-19).
service_placement.ALL=Every UAV hosts every service (tutorials 17, 18).

# ============================================================================================
# QUEUE RAM (queue_ram_policies) - how much UAV RAM a queued task holds
# ============================================================================================
queue_ram.QUEUE_RAM_<MB>=Sets queue_ram of every application to <MB> megabytes for the run (tutorial 16). A task holds that RAM on the UAV while it runs or waits, so the queue holds at most floor((VM RAM - hosted service_ram) / queue_ram) tasks.

# ============================================================================================
# USER MOBILITY - how mobile devices (users) move
# ============================================================================================
user_mobility.SampleMobilityModel=Random walk: a random start inside the area, then a step in a random direction every 3 s at 2 m/s (tutorials 7, 17, 18).
user_mobility.ConvergingMobilityModel=Every user walks at constant speed to an assigned meeting area, is captured on entering its radius and then only random-walks inside it. Three hardcoded areas in tutorials 6 and 8-14; a single area at the map centre in tutorials 15 and 16.
user_mobility.SARTeamMobilityModel=Search & rescue members: fixed teams that wait outside the area until sar_entry_time, then alternate between walking to a new target and stopping, each member offset from its team's reference point (tutorials 8-13; tutorials 14 and 15 define no SAR members).
user_mobility.CombinedMobilityModel=Hosts both populations in one device-id space: normal users on the Converging model, SAR members on the SAR team model (tutorials 8-15).
user_mobility.EventMobilityModel=Random walk plus the pull of world events: with event_gather on, users near an event walk to it, stay inside its radius while it lasts and walk back home afterwards (tutorial 19).

# ONAT: meeting_point_assignment_policy - which meeting area a ConvergingMobilityModel user walks to
meeting_point_assignment.ROUND_ROBIN=Users are split into equal deterministic groups (user i goes to area i % number of areas).
meeting_point_assignment.CLOSEST=Every user goes to the meeting area closest to its random starting position.

# ============================================================================================
# WORKLOAD - how mobile devices generate requests
# ============================================================================================
load_generator.IdleActiveLoadGenerator=Every device picks one application and alternates active periods (Poisson arrivals) and idle periods.
load_generator.SARAwareLoadGenerator=IdleActive with two populations that pick only from their own application subset (sar_application_names for SAR members, everything else for normal users); SAR members start requesting at sar_entry_time (tutorials 8-15, with SAR members only in 8-13).
load_generator.IdleActiveStreamLoadGenerator=IdleActive where a device's request type is an application or a stream (a DAG of applications from streams.xml), with that type's own timing (tutorial 18).
load_generator.EventLoadGenerator=Adds the requests of world events to the stream generator: while an event is active, users inside its radius request what the event is about (tutorial 19).
events.event_requests_only=true: users request nothing but the active event's request while inside its radius and nothing at all otherwise; false: normal requests continue and the events add to them (tutorial 19).
events.event_gather=true: users near an event walk to it (at event_gather_speed); false: events only reach the users who happen to be in range (tutorial 19).

# ============================================================================================
# RESOURCE SCHEDULING - fixed by the scenario factories, not set by a config key
# ============================================================================================
scheduling.CloudletSchedulerSpaceShared_Custom=Per VM: tasks get dedicated cores and the extra ones wait in a FIFO list (one task at a time on a 1-core UAV VM); finish events are floored just above CloudSim's minimum event spacing so very short tasks cannot get stuck.
scheduling.VmSchedulerSpaceShared=Per host: every VM gets dedicated host cores.
scheduling.EdgeVmAllocationPolicy_Custom=Creates every VM on the host that edge_devices.xml declares it under.

# ============================================================================================
# SIMULATION SCENARIOS (simulation_scenarios)
# ============================================================================================
scenario.DEFAULT_SCENARIO=The single placeholder scenario of tutorials 1, 6-19 (the UAV code does not branch on it).
scenario.SINGLE_TIER=sample_app1: every task runs on the edge, on the VM of the host serving the device's WLAN.
scenario.TWO_TIER=sample_app1: each task goes to the cloud with the application's cloud-selection probability, otherwise to the VM of the host serving the device's WLAN.
scenario.TWO_TIER_WITH_EO=sample_app1: like TWO_TIER, but the edge VM is chosen across all edge hosts by the edge orchestrator (load balancing). sample_app2/4: the scenario in which the NETWORK_BASED, UTILIZATION_BASED, HYBRID and fuzzy policies decide between edge and cloud.
scenario.EQUAL_CAPACITY=tutorial 4: every edge host gets the same MIPS.
scenario.RANDOM_CAPACITY=tutorial 4: every edge host gets a MIPS value drawn at random from a fixed pool (the total MIPS stays the same in every scenario).
scenario.TRAFFIC_HEURISTIC=tutorial 4: hosts on slower road sections get more MIPS.
scenario.MOBILE_PROCESSING_SCENARIO=sample_app3: mobile devices have their own processing unit and can run tasks locally.
scenario.ITS_SCENARIO=sample_app5: vehicular scenario where a task goes to the edge or to the cloud over RSU or GSM.

# ============================================================================================
# ORIGINAL EDGECLOUDSIM OFFLOADING POLICIES (tutorials 1-4, sample_app1-5)
# ============================================================================================
# ONAT: The threshold of a policy that exists in several of them is given per tutorial.
legacy_offloading.RANDOM=Tutorial 2: 50/50 mobile or edge. Tutorial 3: 50/50 edge or cloud. sample_app5: about one third each for edge, cloud via RSU and cloud via GSM.
legacy_offloading.DEFAULT_POLICY=Tutorial 4: always the edge, on the VM with the most free CPU capacity (worst-fit) of the host serving the device's WLAN; the policy name is not read.
legacy_offloading.MOBILE_UTIL_HEURISTIC=Tutorial 2: run on the mobile device while its average utilization is below 75 %, else on the edge.
legacy_offloading.EDGE_UTIL_HEURISTIC=Tutorial 2: offload while the edge host of the serving WLAN is below 90 % utilization, else run on the mobile device.
legacy_offloading.NETWORK_BASED=Cloud when the WAN bandwidth is above a threshold (5 Mbps in tutorial 3, 6 Mbps in sample_app2/4), else edge.
legacy_offloading.UTILIZATION_BASED=Cloud when the average edge utilization is above a threshold (75 % in tutorial 3, 80 % in sample_app2/4), else edge.
legacy_offloading.HYBRID=sample_app2/4: cloud only when the WAN bandwidth is above 6 Mbps and the edge utilization above 80 %, else edge. sample_app3: run on the mobile device if it has the free capacity, else edge.
legacy_offloading.ONLY_EDGE=sample_app3: every task is offloaded to the edge.
legacy_offloading.ONLY_MOBILE=sample_app3: every task runs on the mobile device.
legacy_offloading.FUZZY_BASED=sample_app4: two-stage fuzzy logic (jFuzzyLogic): the first stage picks the nearest or a remote edge host, the second picks that edge host or the cloud.
legacy_offloading.FUZZY_COMPETITOR=sample_app4: a competing single fuzzy system for video processing deciding edge or cloud from WAN bandwidth, free CPU, video execution and data size.
legacy_offloading.AI_BASED=sample_app5: Weka models predict the success and the service time of edge, cloud via RSU and cloud via GSM; the option with the lowest predicted service time among those predicted to succeed is chosen (random when none is).
legacy_offloading.AI_TRAINER=sample_app5: picks options randomly with task-type specific probabilities to generate the training data of AI_BASED.
legacy_offloading.MAB=sample_app5: multi-armed bandit (upper confidence bound) over edge, cloud via RSU and cloud via GSM.
legacy_offloading.GAME_THEORY=sample_app5: every device goes to the cloud (GSM or RSU) with its Nash-equilibrium probability, computed from the expected edge and cloud delays (queueing-adjusted by utilization), and to the edge otherwise.
legacy_offloading.PREDICTIVE=sample_app5: after the warm-up period the probability of each option follows its recorded history: the inverse failure rate when the summed failure rate exceeds 30 %, the inverse service time otherwise.
